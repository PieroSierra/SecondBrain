<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Second Brain</title>
  <style>
    /* Self-hosted fonts, bundled with the extension (SIL Open Font License —
       see fonts/OFL-*.txt). Extension pages run under a `default-src 'self'`
       CSP, so a Google Fonts <link> would be blocked; bundling also means the
       popup renders correctly with no network at all. Newsreader is subset to
       just the glyphs in "Second Brain" (4KB) since that is all it sets. */
    @font-face {
      font-family: 'Figtree';
      font-style: normal; font-weight: 400 700; font-display: swap;
      src: url('fonts/figtree-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Figtree';
      font-style: normal; font-weight: 400 700; font-display: swap;
      src: url('fonts/figtree-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Newsreader';
      font-style: normal; font-weight: 500; font-display: swap;
      src: url('fonts/newsreader-wordmark.woff2') format('woff2');
      unicode-range: U+20, U+42, U+53, U+61, U+63-65, U+69, U+6E-6F, U+72;
    }

    /* Design tokens — identical to the dashboard's :root. */
    :root {
      --bg:          #FFFFFF;
      --bg-elev:     #FFFFFF;
      --bg-subtle:   #F1F3F6;
      --ink:         #191B1F;
      --ink-muted:   #5C636E;
      --ink-faint:   #9AA1AC;
      --rule:        #EAECF0;
      --rule-strong: #DCE0E6;

      --clay:        #DB2777;
      --clay-deep:   color-mix(in srgb, var(--clay) 86%, #000);
      --clay-soft:   color-mix(in srgb, var(--clay) 15%, #fff);
      --clay-tint:   color-mix(in srgb, var(--clay)  7%, #fff);
      --clay-ring:   color-mix(in srgb, var(--clay) 32%, #fff);

      --error-bg:    #FEF3F2;
      --error-ink:   #B42318;
      --error-rule:  #FDA29B;
      --error-deep:  color-mix(in srgb, var(--error-ink) 80%, #000);
      --success-bg:  #ECFDF3;
      --success-ink: #067647;
      --success-rule:#A6F4C5;

      --font-display: 'Newsreader', ui-serif, Georgia, "Times New Roman", serif;
      --font-body: 'Figtree', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

      --radius-sm: 8px;
      --radius:    12px;
      --radius-lg: 16px;
      --radius-pill: 999px;
      --shadow-paper: 0 1px 2px rgba(20, 22, 28, 0.04),
                      0 12px 32px -14px rgba(20, 22, 28, 0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Card — like .import-card */
    .card {
      margin: 12px;
      padding: 18px 20px 16px;
      background: var(--bg-elev);
      border: 1px solid var(--rule);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-paper);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Display heading */
    .brand {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    /* URL row */
    .url-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .url-icon {
      color: var(--ink-faint);
      font-size: 11px;
      flex-shrink: 0;
      font-style: normal;
    }
    .url-text {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* Optional context textarea — matches .import-textarea */
    .context-field {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 13px;
      line-height: 1.45;
      resize: vertical;
      min-height: 56px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    /* One ring, not two: the accent border is the focus affordance. */
    .context-field:focus {
      outline: none;
      border-color: var(--clay);
      background: var(--clay-tint);
    }
    .context-field::placeholder { color: var(--ink-faint); }

    /* Button — matches .import-submit exactly */
    #import-btn {
      align-self: flex-start;
      padding: 9px 20px;
      border: 1px solid var(--clay);
      border-radius: var(--radius-pill);
      background: var(--clay);
      color: #fff;
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    #import-btn:hover:not(:disabled) {
      background: var(--clay-deep);
      border-color: var(--clay-deep);
    }
    #import-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    /* "Import page anyway" — the error red, matching the dashboard's override.
       It must not borrow the accent, which marks the safe primary action. */
    #import-btn.import-btn-anyway {
      background: var(--error-ink);
      border-color: var(--error-ink);
      color: #fff;
    }
    #import-btn.import-btn-anyway:hover:not(:disabled) {
      background: var(--error-deep);
      border-color: var(--error-deep);
    }

    /* Op-status row — pulsing dot + animated verb sweep, matches dashboard */
    .op-status {
      display: none;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.82rem;
      line-height: 1.4;
      color: var(--ink-muted);
    }
    .op-status.visible { display: flex; }

    /* Dot */
    .op-status::before {
      content: "";
      display: block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: none;
      margin-top: calc((1.4em - 7px) / 2);
    }
    .op-status-running { color: var(--ink); font-style: italic; }
    .op-status-running::before {
      background: var(--clay);
      animation: pulse 1.4s ease-in-out infinite;
    }

    /* Verb sweep — an accent highlight glides through the italic verb */
    .op-verb {
      font-style: italic;
    }
    .op-verb-anim {
      background-color: var(--ink);
      background-image: linear-gradient(
        100deg,
        var(--ink)        0%,
        var(--ink)       30%,
        var(--clay-deep) 42%,
        var(--clay)      50%,
        var(--clay-deep) 58%,
        var(--ink)       70%,
        var(--ink)      100%
      );
      background-size: 200% 100%;
      background-repeat: repeat;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: verb-sweep 3s linear infinite;
    }
    @keyframes verb-sweep {
      from { background-position:    0% 0; }
      to   { background-position: -200% 0; }
    }
    /* Peaks at scale 1 so the dot's largest state is its native size. */
    @keyframes pulse {
      0%, 100% { transform: scale(0.7); background: var(--ink); }
      50%      { transform: scale(1);   background: var(--clay); }
    }
    @media (prefers-reduced-motion: reduce) {
      .op-verb-anim {
        animation: none;
        background: none;
        -webkit-background-clip: initial;
        background-clip: initial;
        -webkit-text-fill-color: currentColor;
        color: var(--ink);
      }
      .op-status-running::before { animation: none; opacity: 0.7; }
    }

    /* Single status panel — the one red/green space above the button. Exactly
       one variant is ever applied (success | warn | error); never two boxes at
       once. `.status--warn` carries the duplicate-import content (head + link +
       meta linking to the dashboard's raw-file preview). */
    .status {
      display: none;
      padding: 10px 12px;
      border-radius: var(--radius);
      font-size: 0.8rem;
      line-height: 1.45;
      border: 1px solid transparent;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .status.visible { display: block; }
    .status--success {
      background: var(--success-bg);
      color: var(--success-ink);
      border-color: var(--success-rule);
    }
    .status--warn,
    .status--error {
      background: var(--error-bg);
      color: var(--error-ink);
      border-color: var(--error-rule);
    }
    .status-filename {
      margin-top: 4px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      opacity: 0.8;
    }

    /* Hint shown below the (hidden) button while the import runs in background */
    .bg-hint {
      display: none;
      font-size: 0.72rem;
      color: var(--ink-faint);
      font-style: italic;
    }
    .bg-hint.visible { display: block; }

    /* Muted note below the button — e.g. "another import is running" (state 5)
       or the browser-internal-page message (state 6). Neither red nor green. */
    .note {
      display: none;
      font-size: 0.72rem;
      color: var(--ink-muted);
      font-style: italic;
    }
    .note.visible { display: block; }

    /* Duplicate-import content, rendered inside `.status--warn`. */
    .dupe-warning-head {
      font-weight: 600;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .dupe-warning-head::before { content: "⚠"; font-size: 0.9em; }
    .dupe-warning-link {
      display: inline-block;
      margin-top: 3px;
      color: var(--error-ink);
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
    }
    .dupe-warning-link:hover { color: var(--ink); }
    .dupe-warning-meta {
      margin-top: 2px;
      font-size: 0.72rem;
      opacity: 0.8;
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Second Brain</div>

    <div class="url-row">
      <span class="url-icon">↗</span>
      <span class="url-text" id="page-url">Loading…</span>
    </div>

    <textarea id="context-field" class="context-field" rows="2" maxlength="2000"
              placeholder="Optional context or notes…"></textarea>

    <!-- Single status space (red or green, never both): duplicate warning,
         success, or error — whichever the current state calls for. -->
    <div class="status" id="status"></div>

    <button id="import-btn">Import this page</button>

    <!-- Pulsar + animated verb (shown while this tab's import runs) -->
    <div class="op-status op-status-running" id="op-status">
      <span class="op-verb op-verb-anim" id="op-verb">Importing…</span>
    </div>
    <div class="bg-hint" id="bg-hint">Running in background — you can close this.</div>

    <!-- Muted note: cross-tab-busy or browser-internal message -->
    <div class="note" id="note"></div>
  </div>

  <script src="Readability.js"></script>
  <script src="turndown.js"></script>
  <script src="popup.js"></script>
</body>
</html>
